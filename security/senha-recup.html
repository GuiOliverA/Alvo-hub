<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar senha | Alvo Hub</title>
    <link rel="icon" href="../assets/logo.png" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/security.css" />
</head>

<body>
    <div class="auth-shell">
        <div class="auth-card">
            <header class="auth-header">
                <p class="eyebrow">Recuperar senha</p>
                <h1>Esqueceu a senha?</h1>
                <p>Informe seu e-mail cadastrado para receber as instruções de recuperação.</p>
            </header>

            <form id="recoverForm" class="auth-form" novalidate>
                <div class="input-group">
                    <label class="label" for="recoverEmail">E-mail</label>
                    <input id="recoverEmail" name="recoverEmail" class="input-field" type="email"
                        placeholder="seu@email.com" autocomplete="email" />
                </div>

                <div class="auth-actions">
                    <button type="submit" class="button-primary">Enviar instruções</button>
                    <a class="form-link" href="/">Voltar ao login</a>
                </div>
            </form>

            <div class="message-box hidden" aria-live="polite"></div>
        </div>
    </div>
    <script type="module" src="../js/security.js"></script>
</body>

</html>
